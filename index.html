<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<header>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
<div class="container-fluid">
<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03"
aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>
<a class="navbar-brand" href="#"></a>
<div class="collapse navbar-collapse" id="navbarTogglerDemo03">
<ul class="navbar-nav me-auto mb-2 mb-lg-0">
<li class="nav-item">
<a class="nav-link active" aria-current="page" href="#dashboard">Dashboard</a>
</li>
<li class="nav-item">
<a class="nav-link" href="#transaction">Transaction</a>
</li>
<li class="nav-item">
<a class="nav-link" href="#report">Reports</a>
</li>
</ul>
<form class="d-flex" role="search">
<input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
<button class="btn btn-outline-success" type="submit">Search</button>
</form>
</div>
</div>
</nav>
</header>
<main>
<section id="dashboard">
<div row g-4>
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="card-title">Total Balance</h5>
<p class="card-text" id="total balance">60</p>
</div>
</div>
</div>
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="card-title">Total Income</h5>
<p class="card-text" id="total income">60</p>
</div>
</div>
</div>
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="card-title">Total Expense</h5>
<p class="card-text" id="total expense">60</p>
</div>
</div>
</div>
<div class="col-md-6">
<div class="card">
<div class="card-body">
<h5 class="card-title">Savings</h5>
<p class="card-text" id="savings">60</p>
</div>
</div>
</div>
</div>
</section> 
</main>
<section id="transaction">
<div class="Transaction-form">
<form action="Transaction" id="form">
<label>Transaction type:</label>
<select id="transaction" required>
<option value="">Select Type</option>
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>
<div >
<label>Description</label>
<input type="text" id="101" placeholder="description" required>
</div>
<div >
<label>Amount</label>
<input type="number" id="102" min="1" required>
</div>
<div >
<label>Category</label>
<select id="103" required>
<option >Select category</option>
<option value="food">Food</option>
<option value="travel">Travel</option>
<option value="shopping">Shopping</option>
<option value="education">Education</option>
<option value="bills">Bills</option>
<option value="salary">Salary</option>
<option >Other</option>
</select>
</div>
<div >
<label>Date</label>
<input type="date" id="104" required>
</div>
<div >
<button type="submit" > Add Transaction</button>
</div>
</form>
</div>
</section>
<section id="transaction history">
<div class="search">
<h3>Transactions</h3>
<div id="searchBox">
<input type="text" id="search" placeholder="🔍 Search transaction">
</div>
</div>
<table>
  <thead>
    <th>Date</th>
    <th>Description</th>
    <th>Category</th>
    <th>Type</th>
    <th>Amount</th>
    <th>Action</th>
  </thead>
  <tbody id="transactionBody">
  </tbody>
</table> 
</section>
<section id="budget">
  <div>
  <div>
    <label>Monthly budget</label>
    <input type="number">
  </div>
  <div>
    <p>Total Spent</p>
  </div>
  <div>
    <p>Remaining budget</p>
  </div>
    <div>
      <p>Progress bar</p>
      <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar w-75"></div>
</div>
    </div>
  </div>
</section>
<section id="reports">
  <div>
    <div></div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
